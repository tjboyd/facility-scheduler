<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Request time — phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&amp;family=IBM+Plex+Mono:wght@400;500&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Public Sans',system-ui,sans-serif;background:#F5F3EE;color:#14161A;-webkit-font-smoothing:antialiased}
a{color:#1F5B4E}a:hover{color:#17453A}
</style>
</helmet>

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F5F3EE;">

  <div style="position: absolute; inset: 0; display: flex; flex-direction: column;">
    <header style="height: 58px; flex-shrink: 0; background: #FFFFFF; border-bottom: 1px solid #E3E0D9; display: flex; align-items: center; gap: 9px; padding: 0 16px;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="2.5" y="4" width="19" height="16.5" rx="3" stroke="#1F5B4E" stroke-width="1.7"/><path d="M2.5 9h19" stroke="#1F5B4E" stroke-width="1.7"/><path d="M7.5 2.5v3M16.5 2.5v3" stroke="#1F5B4E" stroke-width="1.7" stroke-linecap="round"/><rect x="6" y="12" width="7.5" height="4.5" rx="1.2" fill="#1F5B4E"/></svg>
      <span style="font-family: Archivo, sans-serif; font-weight: 700; font-size: 14px; flex-grow: 1;">[FACILITY NAME]</span>
    </header>
    <div style="padding: 16px;">
      <h1 style="margin: 0 0 12px 0; font-family: Archivo, sans-serif; font-size: 18px; font-weight: 700;">Tuesday, Sep 22</h1>
      <div style="height: 60px; background: #FFFFFF; border: 1.5px dashed #C7CBC9; border-radius: 11px; margin-bottom: 8px;"></div>
      <div style="height: 84px; background: #FBF0DB; border: 1.5px dashed #C9A35B; border-radius: 11px; margin-bottom: 8px;"></div>
      <div style="height: 60px; background: #FFFFFF; border: 1.5px dashed #C7CBC9; border-radius: 11px;"></div>
    </div>
  </div>

  <div style="position: absolute; inset: 0; background: rgba(20, 22, 26, 0.5);"></div>

  <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 700px; background: #FFFFFF; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden;">

    <div style="padding: 10px 0 0 0; display: flex; justify-content: center;">
      <span style="width: 40px; height: 4px; border-radius: 999px; background: #DDD9D1;"></span>
    </div>

    <div style="padding: 14px 18px 16px 18px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid #F1EFE9;">
      <h2 style="margin: 0; flex-grow: 1; font-family: Archivo, sans-serif; font-weight: 700; font-size: 19px; letter-spacing: -0.02em;">Request time</h2>
      <a href="MobileCalendar.dc.html" aria-label="Close" style="width: 34px; height: 34px; border-radius: 999px; background: #F5F3EE; display: flex; align-items: center; justify-content: center; text-decoration: none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="#3F454D" stroke-width="2.2" stroke-linecap="round"/></svg>
      </a>
    </div>

    <div style="flex-grow: 1; padding: 18px; display: flex; flex-direction: column; gap: 18px;">

      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: #F5F3EE; border: 1px solid #E3E0D9; border-radius: 10px;">
        <span style="width: 9px; height: 9px; border-radius: 999px; background: #1F5B4E;"></span>
        <span style="font-size: 14.5px; font-weight: 600; flex-grow: 1;">14U Gold</span>
        <span style="font-size: 11.5px; color: #7A7F87;">your team</span>
      </div>

      <div>
        <label for="m-date" style="display: block; font-size: 12.5px; font-weight: 600; color: #3F454D; margin-bottom: 7px;">Date</label>
        <input id="m-date" type="text" value="Tuesday, Sep 22, 2026" style="width: 100%; height: 48px; padding: 0 14px; font-family: 'Public Sans', sans-serif; font-size: 14.5px; font-weight: 500; color: #14161A; background: #FFFFFF; border: 1px solid #D9D5CC; border-radius: 10px; outline: none;">
      </div>

      <div>
        <div style="font-size: 12.5px; font-weight: 600; color: #3F454D; margin-bottom: 8px;">Start time</div>
        <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
          <button type="button" style="height: 46px; background: #FFFFFF; border: 1px solid #D9D5CC; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #14161A; cursor: pointer;">3:00 PM</button>
          <button type="button" disabled style="height: 46px; background: #F2F0EA; border: 1px solid #E7E4DD; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9A9EA5; text-decoration: line-through;">3:30 PM</button>
          <button type="button" disabled style="height: 46px; background: #F2F0EA; border: 1px solid #E7E4DD; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9A9EA5; text-decoration: line-through;">4:00 PM</button>
          <button type="button" disabled style="height: 46px; background: #F2F0EA; border: 1px solid #E7E4DD; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9A9EA5; text-decoration: line-through;">4:30 PM</button>
          <button type="button" aria-pressed="true" style="height: 46px; background: #1F5B4E; border: 1px solid #1F5B4E; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; font-weight: 500; color: #FFFFFF; cursor: pointer;">5:00 PM</button>
          <button type="button" style="height: 46px; background: #FFFFFF; border: 1px solid #D9D5CC; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #14161A; cursor: pointer;">5:30 PM</button>
          <button type="button" disabled style="height: 46px; background: #F2F0EA; border: 1px solid #E7E4DD; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9A9EA5; text-decoration: line-through;">6:00 PM</button>
          <button type="button" disabled style="height: 46px; background: #F2F0EA; border: 1px solid #E7E4DD; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #9A9EA5; text-decoration: line-through;">6:30 PM</button>
          <button type="button" style="height: 46px; background: #FFFFFF; border: 1px solid #D9D5CC; border-radius: 10px; font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: #14161A; cursor: pointer;">7:30 PM</button>
        </div>
      </div>

      <div>
        <div style="font-size: 12.5px; font-weight: 600; color: #3F454D; margin-bottom: 8px;">Length</div>
        <div style="display: flex; gap: 8px;">
          <button type="button" style="flex-grow: 1; height: 46px; background: #FFFFFF; border: 1px solid #D9D5CC; border-radius: 10px; font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 500; color: #14161A; cursor: pointer;">30 min</button>
          <button type="button" aria-pressed="true" style="flex-grow: 1; height: 46px; background: #1F5B4E; border: 1px solid #1F5B4E; border-radius: 10px; font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 600; color: #FFFFFF; cursor: pointer;">1 hour</button>
          <button type="button" disabled style="flex-grow: 1; height: 46px; background: #F2F0EA; border: 1px solid #E7E4DD; border-radius: 10px; font-family: 'Public Sans', sans-serif; font-size: 14px; font-weight: 500; color: #9A9EA5;">1.5 hours</button>
        </div>
        <p style="margin: 8px 0 0 0; font-size: 12px; color: #7A7F87;">1.5 hours would run into 16U Black's block at 6:00 PM.</p>
      </div>

      <div style="background: #E4EDE9; border: 1px solid #9CBFB3; border-radius: 10px; padding: 14px 16px;">
        <div style="font-size: 15px; font-weight: 700; color: #14453A;">Tue, Sep 22 · 5:00 – 6:00 PM</div>
        <div style="font-size: 12.5px; color: #35695C; margin-top: 3px;">2 blocks of 30 minutes</div>
      </div>

    </div>

    <div style="flex-shrink: 0; padding: 16px 18px 26px 18px; border-top: 1px solid #F1EFE9; background: #FAF8F4;">
      <a href="MobileCalendar.dc.html" style="display: flex; align-items: center; justify-content: center; height: 52px; background: #1F5B4E; color: #FFFFFF; border-radius: 12px; font-size: 15.5px; font-weight: 600; text-decoration: none;">Send request</a>
      <p style="margin: 10px 0 0 0; text-align: center; font-size: 12px; color: #5F646C;">Goes to the facility approver. Shows as pending until reviewed.</p>
    </div>

  </div>

</div>
</x-dc>

</body>
</html>
